<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RF-04 - Maquina de estados de ordenes de trabajo</title>
    <style>
      body {
        margin: 0;
        background: #f7f8f6;
        color: #1f2937;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        max-width: 1160px;
        margin: 0 auto;
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        color: #64748b;
        font-size: 14px;
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d7ded8;
        border-radius: 8px;
        background: #ffffff;
      }

      .state {
        fill: #eef7f0;
        stroke: #2f855a;
        stroke-width: 1.5;
      }

      .terminal {
        fill: #f1f5f9;
        stroke: #64748b;
        stroke-width: 1.5;
      }

      .action {
        fill: #fff7ed;
        stroke: #c2410c;
        stroke-width: 1.5;
      }

      .actor {
        fill: #ecfeff;
        stroke: #0e7490;
        stroke-width: 1.5;
      }

      .label {
        fill: #0f172a;
        font-size: 15px;
        font-weight: 700;
      }

      .small {
        fill: #475569;
        font-size: 12px;
      }

      .line {
        fill: none;
        stroke: #334155;
        stroke-width: 1.6;
        marker-end: url(#arrow);
      }

      .muted {
        fill: none;
        stroke: #94a3b8;
        stroke-width: 1.2;
        stroke-dasharray: 5 5;
        marker-end: url(#arrow-muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RF-04 - Maquina de estados de ordenes de trabajo</h1>
      <p>
        Cada actor interactua unicamente con el sistema. Las transiciones y permisos se validan en backend.
      </p>

      <svg viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
        <title id="title">Maquina de estados de RF-04</title>
        <desc id="desc">
          Estados PENDIENTE_ASIGNACION, ASIGNADA, EN_EJECUCION, COMPLETADA_TECNICO,
          DEVUELTA_CORRECCION y CERRADA con acciones de administrador y mecanico.
        </desc>

        <defs>
          <marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3">
            <path d="M0,0 L9,3 L0,6 Z" fill="#334155"></path>
          </marker>
          <marker id="arrow-muted" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3">
            <path d="M0,0 L9,3 L0,6 Z" fill="#94a3b8"></path>
          </marker>
        </defs>

        <rect class="actor" x="55" y="70" width="180" height="74" rx="8"></rect>
        <text class="label" x="145" y="103" text-anchor="middle">Administrador</text>
        <text class="small" x="145" y="125" text-anchor="middle">crea, asigna, revisa</text>

        <rect class="actor" x="55" y="460" width="180" height="74" rx="8"></rect>
        <text class="label" x="145" y="493" text-anchor="middle">Mecanico</text>
        <text class="small" x="145" y="515" text-anchor="middle">ejecuta y completa</text>

        <rect class="actor" x="55" y="265" width="180" height="74" rx="8"></rect>
        <text class="label" x="145" y="298" text-anchor="middle">Conductor</text>
        <text class="small" x="145" y="320" text-anchor="middle">sin acceso interno</text>

        <rect class="action" x="280" y="50" width="180" height="74" rx="8"></rect>
        <text class="label" x="370" y="82" text-anchor="middle">Orden recibida</text>
        <text class="small" x="370" y="104" text-anchor="middle">RF-02, RF-03 o directa</text>

        <rect class="state" x="280" y="175" width="180" height="76" rx="8"></rect>
        <text class="label" x="370" y="207" text-anchor="middle">PENDIENTE</text>
        <text class="label" x="370" y="227" text-anchor="middle">ASIGNACION</text>

        <rect class="state" x="530" y="175" width="160" height="76" rx="8"></rect>
        <text class="label" x="610" y="218" text-anchor="middle">ASIGNADA</text>

        <rect class="state" x="760" y="175" width="170" height="76" rx="8"></rect>
        <text class="label" x="845" y="207" text-anchor="middle">EN</text>
        <text class="label" x="845" y="227" text-anchor="middle">EJECUCION</text>

        <rect class="state" x="760" y="345" width="170" height="76" rx="8"></rect>
        <text class="label" x="845" y="376" text-anchor="middle">COMPLETADA</text>
        <text class="label" x="845" y="397" text-anchor="middle">TECNICO</text>

        <rect class="state" x="530" y="345" width="160" height="76" rx="8"></rect>
        <text class="label" x="610" y="376" text-anchor="middle">DEVUELTA</text>
        <text class="label" x="610" y="397" text-anchor="middle">CORRECCION</text>

        <rect class="terminal" x="530" y="485" width="160" height="76" rx="8"></rect>
        <text class="label" x="610" y="529" text-anchor="middle">CERRADA</text>

        <path class="line" d="M370 124 L370 166"></path>
        <path class="line" d="M460 213 L521 213"></path>
        <path class="line" d="M690 213 L751 213"></path>
        <path class="line" d="M845 251 L845 336"></path>
        <path class="line" d="M760 383 L699 383"></path>
        <path class="line" d="M610 345 C610 295 720 288 798 251"></path>
        <path class="line" d="M808 421 C770 480 708 516 699 523"></path>

        <path class="muted" d="M235 107 L271 87"></path>
        <path class="muted" d="M235 302 L271 302"></path>
        <path class="muted" d="M235 497 C340 505 470 515 521 523"></path>
        <path class="muted" d="M235 497 C420 455 610 445 760 402"></path>

        <text class="small" x="493" y="198" text-anchor="middle">asignar</text>
        <text class="small" x="725" y="198" text-anchor="middle">iniciar</text>
        <text class="small" x="878" y="301" text-anchor="middle">completar</text>
        <text class="small" x="731" y="372" text-anchor="middle">devolver</text>
        <text class="small" x="674" y="310" text-anchor="middle">reanudar</text>
        <text class="small" x="753" y="483" text-anchor="middle">cerrar</text>
        <text class="small" x="290" y="306">acceso denegado</text>

        <rect class="action" x="280" y="340" width="180" height="76" rx="8"></rect>
        <text class="label" x="370" y="371" text-anchor="middle">Reasignacion</text>
        <text class="small" x="370" y="393" text-anchor="middle">audita mecanico anterior</text>

        <path class="muted" d="M460 378 C495 335 525 292 555 251"></path>
        <path class="muted" d="M460 378 C555 335 660 292 780 251"></path>
        <path class="muted" d="M460 378 L521 383"></path>

        <text class="small" x="350" y="468">
          CERRADA es terminal. No hay reapertura ni escritura tecnica posterior.
        </text>
      </svg>
    </main>
  </body>
</html>
