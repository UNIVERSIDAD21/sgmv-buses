<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RF-05 Central de repuestos</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .input {
    fill: var(--input);
  }
  .process {
    fill: var(--process);
  }
  .storage {
    fill: var(--storage);
  }
  .external {
    fill: var(--external);
  }
  .risk {
    fill: var(--risk);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
    <title id="title">RF-05 Central de repuestos</title>
    <desc id="desc">
      Diagrama de actores, casos de uso y tablas reutilizadas para RF-05. Los actores solo se conectan con el sistema.
    </desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="var(--line)" />
      </marker>
    </defs>

    <text class="title" x="24" y="36">RF-05 — Central de repuestos</text>
    <text class="small" x="24" y="58">Catalogo, existencias, entradas, ajustes y movimientos trazables. RF-06 permanece fuera de alcance.</text>

    <rect class="zone" x="280" y="78" width="400" height="440" rx="10" />
    <text class="label" x="430" y="104">Sistema SGMV</text>

    <rect class="node input" x="34" y="126" width="170" height="74" rx="8" />
    <text class="label" x="70" y="158">Administrador</text>
    <text class="small" x="56" y="178">central administrativa</text>

    <rect class="node input" x="34" y="286" width="170" height="74" rx="8" />
    <text class="label" x="78" y="318">Mecánico</text>
    <text class="small" x="54" y="338">solo consumo RF-04</text>

    <rect class="node input" x="34" y="446" width="170" height="74" rx="8" />
    <text class="label" x="76" y="478">Conductor</text>
    <text class="small" x="66" y="498">sin acceso RF-05</text>

    <rect class="node process" x="330" y="132" width="300" height="58" rx="8" />
    <text class="label" x="386" y="158">Gestionar catalogo</text>
    <text class="small" x="372" y="176">crear, editar, activar/desactivar</text>

    <rect class="node process" x="330" y="218" width="300" height="58" rx="8" />
    <text class="label" x="378" y="244">Registrar existencias</text>
    <text class="small" x="374" y="262">stock inicial, entradas y ajustes</text>

    <rect class="node process" x="330" y="304" width="300" height="58" rx="8" />
    <text class="label" x="376" y="330">Consultar disponibilidad</text>
    <text class="small" x="382" y="348">disponible, bajo, agotado</text>

    <rect class="node process" x="330" y="390" width="300" height="58" rx="8" />
    <text class="label" x="378" y="416">Auditar movimientos</text>
    <text class="small" x="382" y="434">historial inmutable y responsable</text>

    <rect class="node external" x="330" y="474" width="300" height="58" rx="8" />
    <text class="label" x="368" y="500">Consumir desde orden RF-04</text>
    <text class="small" x="380" y="518">orden asignada en ejecucion</text>

    <rect class="zone" x="724" y="78" width="210" height="440" rx="10" />
    <text class="label" x="778" y="104">Persistencia</text>

    <rect class="node storage" x="756" y="138" width="150" height="46" rx="8" />
    <text class="label" x="790" y="166">repuestos</text>

    <rect class="node storage" x="748" y="230" width="166" height="46" rx="8" />
    <text class="label" x="762" y="258">movimientos</text>

    <rect class="node storage" x="742" y="322" width="178" height="46" rx="8" />
    <text class="label" x="758" y="350">consumos RF-04</text>

    <rect class="node storage" x="748" y="414" width="166" height="46" rx="8" />
    <text class="label" x="766" y="442">ordenes y usuarios</text>

    <path class="edge" d="M204 163 H314" marker-end="url(#arrow)" />
    <path class="edge" d="M204 163 C244 163 260 247 314 247" marker-end="url(#arrow)" />
    <path class="edge" d="M204 163 C244 163 260 419 314 419" marker-end="url(#arrow)" />

    <path class="edge" d="M204 323 C254 323 264 503 314 503" marker-end="url(#arrow)" />
    <path class="edge" d="M204 483 C238 483 238 548 280 548" marker-end="url(#arrow)" />
    <text class="small" x="290" y="552">403 / acceso denegado</text>

    <path class="edge" d="M630 161 H740" marker-end="url(#arrow)" />
    <path class="edge" d="M630 247 H732" marker-end="url(#arrow)" />
    <path class="edge" d="M630 333 H726" marker-end="url(#arrow)" />
    <path class="edge" d="M630 419 H732" marker-end="url(#arrow)" />
    <path class="edge" d="M630 503 C692 503 690 438 732 438" marker-end="url(#arrow)" />
    <path class="edge" d="M630 503 C706 503 690 345 726 345" marker-end="url(#arrow)" />

    <rect class="node risk" x="320" y="548" width="330" height="46" rx="8" />
    <text class="label" x="342" y="576">Sin compras, proveedores, exportaciones ni RF-06</text>
  </svg>
</main>
